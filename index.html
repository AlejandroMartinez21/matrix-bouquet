<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Bouquet</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block}
  .ui{position:fixed;font-family:Consolas,'MS Gothic',monospace;pointer-events:none;user-select:none}
  #hint{left:16px;bottom:12px;color:#ff8cc6;font-size:12px;opacity:.55;transition:opacity 2s}
  #prompt{left:0;right:0;bottom:9%;text-align:center;color:#ffb6db;font-size:22px;letter-spacing:.35em;
    text-shadow:0 0 8px #ff5aa8,0 0 22px #ff5aa8;opacity:0;transition:opacity 1.2s}
  #prompt.show{opacity:1;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.5)}}
  #info{left:18px;top:16px;color:#ffd6ea;font-size:14px;line-height:1.6;opacity:0;transition:opacity .8s;
    text-shadow:0 0 6px #ff5aa8;max-width:min(420px,80vw)}
  #info.show{opacity:1}
  #info b{color:#fff;font-size:18px;letter-spacing:.2em}
  #info .bee{color:#ffd66b}
  #info .dim{color:#ff8cc6;opacity:.7;font-size:12px}
  #ghint{left:0;right:0;bottom:4%;text-align:center;color:#ff8cc6;font-size:14px;letter-spacing:.2em;opacity:0;transition:opacity 1.5s;text-shadow:0 0 6px #ff5aa8}
  #ghint.show{opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="ui">space: pause &middot; N: skip ahead</div>
<div id="prompt" class="ui">&#10022; click the bouquet &#10022;</div>
<div id="ghint" class="ui">click any flower to take a closer look</div>
<div id="info" class="ui"></div>
<script>
'use strict';
/* =========================================================
   MATRIX BOUQUET
   Everything is a 3D point cloud of flickering glyphs.
   1 standing flower -> 10 growth steps in soft pastel vases
   -> click -> drifts apart into a garden landscape
   -> click a flower to zoom in and watch its honey bees.
   ========================================================= */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $prompt = document.getElementById('prompt'), $info = document.getElementById('info'),
      $ghint = document.getElementById('ghint'), $hint = document.getElementById('hint');
let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  initStars();
}

/* ---------- helpers ---------- */
const TAU = Math.PI * 2, GA = Math.PI * (3 - Math.sqrt(5));
const rand = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = u => u * u * (3 - 2 * u);
function gauss() { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); }
function norm(v) { const l = Math.hypot(v.x, v.y, v.z) || 1; v.x /= l; v.y /= l; v.z /= l; return v; }
function lerp3(a, b, k) { a.x += (b.x - a.x) * k; a.y += (b.y - a.y) * k; a.z += (b.z - a.z) * k; }
const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const copy3 = v => ({ x: v.x, y: v.y, z: v.z });
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(obj) { let t = 0; for (const k in obj) t += obj[k]; let r = Math.random() * t; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }

/* ---------- colors ---------- */
const COLORS = [], CIDX = new Map(), FAMS = {};
function cidx(hex) { if (!CIDX.has(hex)) { CIDX.set(hex, COLORS.length); COLORS.push(hex); } return CIDX.get(hex); }
function fam(name, list) { FAMS[name] = list.map(cidx); }
// flowers
fam('white',      ['#ffffff', '#fdf7ff', '#f6eef5', '#fff8fc']);
fam('whiteDark',  ['#cfc3d3', '#bfb2c6', '#d9cfdb']);

// greens & landscape
fam('green',      ['#1fae52', '#26c260', '#169443', '#35d071']);
fam('greenDark',  ['#0f7a35', '#138a3d']);
fam('leaf',       ['#2ecf68', '#46e07e', '#22b257', '#5fe892']);
fam('fern',       ['#3cc46a', '#2fae5a', '#58d983']);
fam('ground',     ['#1d5e2c', '#245f2a', '#2f5a22', '#2b6b33']);
fam('moss',       ['#3f9a4a', '#2f8a3c', '#4fb35a']);
fam('soil',       ['#9a6a45', '#8a5a3a', '#a8774f']);

// soft pastel vases
fam('babyPink',   ['#ffc4dd', '#ffb8d6', '#ffd0e4']);
fam('mint',       ['#b6f2d8', '#a6ead0', '#c6f7e2']);
fam('lilac',      ['#d9c6ff', '#cfb8ff', '#e4d6ff']);

fam('peachSoft',  ['#ffd8c2', '#ffccb0', '#ffe2d0']);
fam('cream',      ['#fff6ea', '#fff0dd', '#fffaf2']);

// bees
fam('bee',        ['#f5b82e', '#f0b030']);
fam('beeStripe',  ['#7a4518']);
fam('beeFuzz',    ['#e0a040', '#d99538']);
fam('beeHead',    ['#6a3e18']);
fam('beeLeg',     ['#8a5a2a']);

fam('pollen',     ['#ff9a1a']);
fam('zz',         ['#bfe3ff']);
const FLASH = cidx('#ffffff');

const SCHEME = {
  pink:   { main: 'pink',   dark: 'pinkDark',   light: 'pinkLight',   stripe: 'pinkDark',    lip: 'maroon' },
  white:  { main: 'white',  dark: 'whiteDark',  light: 'blush',       stripe: 'pink',        lip: 'pink' },
  blush:  { main: 'blush',  dark: 'pink',       light: 'white',       stripe: 'pink',        lip: 'pink' },
  maroon: { main: 'maroon', dark: 'maroonDark', light: 'maroonLight', stripe: 'maroonLight', lip: 'pink' },
  peach:  { main: 'peach',  dark: 'peachDark',  light: 'peachLight',  stripe: 'peachDark',   lip: 'maroon' },
  orchid: { main: 'orchid', dark: 'orchidDark', light: 'orchidLight', stripe: 'white',       lip: 'orchidDark' },
  lilac:  { main: 'lilacF', dark: 'lilacDark',  light: 'lilacLight',  stripe: 'lilacDark',   lip: 'orchidDark' },
  sky:    { main: 'hyd',    dark: 'hydDark',    light: 'sky',         stripe: 'hydDark',     lip: 'hydDark' },
  sun:    { main: 'sunPetal', dark: 'sunPetalDark', light: 'gold',    stripe: 'sunPetalDark', lip: 'gold' },
};
const SCHEME_NAME = { pink: 'Pink', white: 'White', blush: 'Blush', maroon: 'Maroon', peach: 'Peach', orchid: 'Violet', lilac: 'Lilac', sky: 'Blue', sun: '' };
const KIND_NAME = { rose: 'Rose', peony: 'Peony', ranunculus: 'Ranunculus', lily: 'Lily', orchid: 'Orchid', sunflower: 'Sunflower',
  daisy: 'Daisy', tulip: 'Tulip', hydrangea: 'Hydrangea', carnation: 'Carnation', cosmos: 'Cosmos', lotus: 'Lotus' };

/* ---------- glyphs ---------- */
const G = {
  petal:  Array.from('0123456789@#%&*+=$¤ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷ'),
  stem:   Array.from('|!1lI:¦|1|'),
  leaf:   Array.from('ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘ<>/\\v^'),
  soft:   Array.from('o0O°~=+*:·'),
  heart:  ['♥'],
  center: Array.from('@#&%8*o0'),
  seed:   Array.from('@o0%&8#'),
  filler: Array.from('·*°+.:'),
  grass:  Array.from('|/\\\'",;:!'),
  ground: Array.from('.,\'`·:;'),
  water:  Array.from('~≈-~~'),
  stone:  Array.from('o0O@'),
  bark:   Array.from('|#H%¦'),
  blossom:Array.from('*+@%&°ﾊﾐ'),
};

/* ---------- glyph sprites (glow baked in) ---------- */
const SPR = new Map(), SS = 40, FPX = 22;
const FONT = "'MS Gothic','Yu Gothic','Meiryo','Consolas',monospace";
function sprite(ci, ch) {
  const key = ci + '|' + ch;
  let s = SPR.get(key);
  if (!s) {
    s = document.createElement('canvas'); s.width = s.height = SS;
    const g = s.getContext('2d');
    g.font = `${FPX}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = COLORS[ci]; g.shadowColor = COLORS[ci]; g.shadowBlur = 7;
    g.fillText(ch, SS / 2, SS / 2 + 1);
    g.shadowBlur = 0; g.fillText(ch, SS / 2, SS / 2 + 1);
    SPR.set(key, s);
  }
  return s;
}

/* ---------- constants ---------- */
const SP = 4.6;          // flower glyph spacing (model units)
const SPV = 5.6;         // vase spacing
const SPS = 4.8;         // stem spacing
const GSP = 7.5;         // garden flower spacing (garden is far bigger, so glyphs are coarser)
const SPR_K = SP * 1.05 * SS / FPX;
const DCAM = 1100;
const NB = 40;
const COUNTS = [1, 3, 5, 8, 11, 15, 19, 24, 29, 35];
const FILL   = [0, 2, 4, 6, 9, 12, 15, 19, 23, 28];

/* ---------- soft containers (surface-of-revolution profiles: [height, radius]) ---------- */
function dotPat(h, a, r, cell, rad) {
  const n = Math.max(3, Math.round(TAU * r / cell)), row = Math.floor(h / cell);
  let fu = (a / TAU * n + (row & 1) * 0.5) % 1; if (fu < 0) fu += 1;
  const fv = (h / cell) % 1;
  return ((fu - 0.5) ** 2 + (fv - 0.5) ** 2) * cell * cell < rad * rad;
}
const VASES = [
  { name: 'mound', mound: true,
    pts: [[0, 30], [4, 27], [9, 18], [13, 7], [15, 2]],
    color: (h) => [Math.random() < 0.35 || h > 11 ? 'moss' : 'soil', 'ground'] },
  { name: 'wrapper', wrap: true,
    pts: [[0, 4], [30, 16], [70, 36], [110, 56], [132, 68]],
    topAt: a => 116 + 9 * Math.abs(Math.sin(4 * a)),
    color: (h, a) => {
      if (h > 26 && h < 36) return ['pink', 'heart'];
      if (h > 108) return ['softWhite', 'soft'];
      return [Math.floor((a / TAU) * 10) % 2 ? 'babyPink' : 'cream', 'soft'];
    } },
  { name: 'jar',
    pts: [[0, 22], [6, 30], [25, 38], [45, 36], [60, 26], [68, 20], [74, 24]],
    color: (h, a, H, r) => h > H - 6 ? ['cream', 'soft'] : [dotPat(h, a, r, 14, 3.6) ? 'softWhite' : 'mint', 'soft'] },
  { name: 'bubble',
    pts: [[0, 30], [10, 50], [45, 66], [80, 56], [100, 30], [110, 24], [118, 30]],
    color: (h, a, H, r) => h > H - 8 ? ['softWhite', 'soft'] : [dotPat(h, a, r, 22, 3.5) ? 'softWhite' : 'lilac', 'soft'] },
  { name: 'jug',
    pts: [[0, 44], [8, 50], [60, 60], [110, 52], [140, 40], [155, 44]],
    color: (h, a, H, r) => {
      if (h > H - 7) return ['cream', 'soft'];
      if (h > 58 && h < 80 && dotPat(h - 58, a, r, 22, 6)) return ['pink', 'heart'];
      return ['butter', 'soft'];
    } },
  { name: 'pot',
    pts: [[0, 46], [8, 58], [50, 76], [100, 78], [140, 66], [160, 72], [166, 74]],
    color: (h, a, H, r) => h > H - 9 || h < 6 ? ['cream', 'soft'] : [dotPat(h, a, r, 20, 4.2) ? 'softWhite' : 'babyPink', 'soft'] },
  { name: 'fishbowl', glass: true,
    pts: [[0, 40], [6, 60], [50, 100], [110, 100], [160, 70], [175, 64], [180, 68]],
    color: (h) => {
      if (h < 14) return [pick(['peachSoft', 'lilac', 'babyPink', 'mint']), 'stone'];
      if (h > 98 && h < 106) return ['sky', 'water'];
      return ['glass', 'soft'];
    } },
  { name: 'tall',
    pts: [[0, 50], [10, 60], [60, 72], [130, 56], [190, 48], [225, 62], [232, 66]],
    color: (h, a) => {
      if (h > 224) return ['cream', 'soft'];
      return [Math.abs((h + 8 * Math.sin(a * 4)) % 30) < 5 ? 'softWhite' : 'peachSoft', 'soft'];
    } },
  { name: 'bucket',
    pts: [[0, 74], [6, 80], [120, 94], [220, 104], [230, 110]],
    color: (h) => h > 220 ? ['cream', 'soft'] : [['babyPink', 'peachSoft', 'butter', 'mint', 'sky', 'lilac'][Math.floor(h / 36) % 6], 'soft'] },
  { name: 'heartvase',
    pts: [[0, 64], [10, 78], [60, 118], [140, 136], [210, 116], [250, 86], [270, 84], [280, 96]],
    color: (h, a, H, r) => {
      if (h > H - 9 || h < 9) return ['cream', 'soft'];
      if (dotPat(h, a, r, 30, 7)) return ['softWhite', 'heart'];
      return ['babyPink', 'soft'];
    } },
];
function profileFn(pts) {
  return h => {
    if (h <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (h <= pts[i][0]) {
        const [h0, r0] = pts[i - 1], [h1, r1] = pts[i];
        const u = (h - h0) / (h1 - h0), c = (1 - Math.cos(u * Math.PI)) / 2;
        return r0 + (r1 - r0) * c;
      }
    }
    return pts[pts.length - 1][1];
  };
}
VASES.forEach(d => {
  d.H = d.pts[d.pts.length - 1][0];
  d.mouthH = d.wrap ? 116 : d.H;
  d.mouthR = d.wrap ? 58 : d.pts[d.pts.length - 1][1];
  d.maxR = Math.max(...d.pts.map(p => p[1]));
});

/* ---------- flower shape generators (local units, +z = facing) ---------- */
function hexDisk(R, sp, fn) {
  const dy = sp * 0.866; let row = 0;
  for (let y = -R; y <= R; y += dy, row++) {
    const off = (row & 1) ? sp / 2 : 0;
    for (let x = -R - off; x <= R; x += sp)
      fn(x + (Math.random() - .5) * sp * 0.2, y + (Math.random() - .5) * sp * 0.2);
  }
}
function lanes(w, step) { const n = Math.max(1, Math.round(2 * w / step) + 1); const out = []; for (let j = 0; j < n; j++) out.push(n === 1 ? 0 : -w + 2 * w * j / (n - 1)); return out; }

const GEN = {
  rose(sp, c) {
    const o = [];
    hexDisk(1.05, sp, (x, y) => {
      const r = Math.hypot(x, y), a = Math.atan2(y, x), R = 0.93 + 0.07 * Math.cos(5 * a);
      if (r > R) return;
      const rn = r / R;
      let ph = (a / TAU + rn * 3.2) % 1; if (ph < 0) ph += 1;
      o.push({ x, y, z: 0.4 * (1 - rn * rn) + 0.05, fam: ph < 0.2 ? c.dark : (rn > 0.82 ? c.light : c.main), gs: 'petal', rn });
    });
    for (let z = 0.02; z > -0.42; z -= sp * 0.9) {
      const rr = 0.93 * (1 + z * 0.9), n = Math.max(6, Math.round(TAU * rr / sp));
      for (let k = 0; k < n; k++) {
        const a = (k + Math.random() * 0.3) / n * TAU;
        o.push({ x: rr * Math.cos(a), y: rr * Math.sin(a), z, fam: Math.cos(5 * a) > 0.8 ? c.dark : c.main, gs: 'petal', rn: 1 });
      }
    }
    return o;
  },
  peony(sp, c) {
    const o = [], R = 0.92, n = Math.round(4 * Math.PI * R * R / (sp * sp * 0.9));
    for (let i = 0; i < n; i++) {
      const zf = 1 - 2 * (i + .5) / n; if (zf < -0.35) break;
      const rr = Math.sqrt(1 - zf * zf), a = i * GA, ruf = 1 + 0.08 * Math.sin(9 * a + zf * 10);
      const ns = Math.sin(7 * a + zf * 14);
      o.push({ x: R * rr * Math.cos(a) * ruf, y: R * rr * Math.sin(a) * ruf, z: R * zf * 0.75 * ruf + 0.05,
        fam: zf > 0.8 ? c.light : (ns > 0.55 ? c.dark : c.main), gs: 'petal', rn: 1 - zf });
    }
    return o;
  },
  ranunculus(sp, c) {
    const o = []; let ring = 0;
    for (let r = 0.04; r <= 0.98; r += sp * 0.72, ring++) {
      const n = Math.max(4, Math.round(TAU * r / sp)), off = Math.random() * TAU;
      for (let k = 0; k < n; k++) {
        const a = off + k / n * TAU, rr = r * (1 + 0.04 * Math.sin(a * 7 + ring));
        const z = 0.55 * Math.pow(Math.max(0, 1 - r * r), 0.6) + 0.02;
        const f = r < 0.1 ? 'moss' : (ring % 3 === 0 ? c.dark : (r < 0.35 ? c.light : c.main));
        o.push({ x: rr * Math.cos(a), y: rr * Math.sin(a), z, fam: f, gs: 'petal', rn: r });
      }
    }
    for (let z = 0.0; z > -0.32; z -= sp * 0.9) {
      const rr = 0.98 * (1 + z), n = Math.max(6, Math.round(TAU * rr / sp));
      for (let k = 0; k < n; k++) { const a = k / n * TAU; o.push({ x: rr * Math.cos(a), y: rr * Math.sin(a), z, fam: c.main, gs: 'petal', rn: 1 }); }
    }
    return o;
  },
  sunflower(sp, c) {
    const o = [], Rc = 0.42, n = Math.round(Math.PI * Rc * Rc / (sp * sp * 0.75));
    for (let i = 0; i < n; i++) {
      const r = Rc * Math.sqrt((i + .5) / n), a = i * GA, rn = r / Rc, arm = (i % 21) < 4;
      o.push({ x: r * Math.cos(a), y: r * Math.sin(a), z: 0.1 * (1 - rn * rn) + 0.04,
        fam: rn > 0.86 || arm ? 'sunCenterLight' : 'sunCenter', gs: 'seed', rn: rn * 0.3 });
    }
    for (let layer = 0; layer < 2; layer++) {
      const np = 20, L = layer ? 0.92 : 1.0;
      for (let k = 0; k < np; k++) {
        const a0 = (k + layer * 0.5) / np * TAU, ca = Math.cos(a0), sa = Math.sin(a0);
        for (let u = Rc * 0.95; u <= L; u += sp * 0.85) {
          const w = 0.085 * Math.sin(Math.PI * Math.min(1, (u - Rc + 0.04) / (L - Rc + 0.04)));
          const ln = lanes(w, sp * 0.85);
          for (const v of ln)
            o.push({ x: ca * u - sa * v, y: sa * u + ca * v, z: 0.03 - layer * 0.03 - 0.15 * (u - Rc) ** 2,
              fam: Math.abs(v) < sp * 0.3 && ln.length > 2 ? c.dark : (u > L - 0.1 ? c.light : c.main), gs: 'petal', rn: 0.4 + u * 0.5 });
        }
      }
    }
    return o;
  },
  orchid(sp, c) {
    const o = [];
    const lobe = (ang, dist, ra, rb, zb, famFn) => {
      const dx = Math.cos(ang), dy = Math.sin(ang), qx = -dy, qy = dx, cx = dx * dist, cy = dy * dist;
      hexDisk(Math.max(ra, rb), sp, (x, y) => {
        const al = x * dx + y * dy, ac = x * qx + y * qy, d = (al / ra) ** 2 + (ac / rb) ** 2;
        if (d > 1) return;

  hydrangea: .82, carnation: .36, cosmos: .1, lotus: .5 };
const KIND_SCHEMES = {

function chooseFlower(i) {

let particles = [], elements = [], flowers = [], fillers = [], gardenFlowers = [];

function P(el, props) {
  const p = { el, lx: 0, ly: 0, lz: 0, t: 0, tt: 0, fam: FAMS.white, gs: G.petal, gm: 1, am: 1,
    state: 0, delay: 0, dur: 0, fs: 0, sx: 0, sy: 0, px: W / 2, py: -20, st: 0,
    hasN: false, nx: 0, nz: 0, dead: false, dStart: 0, vx: 0, vy: 0, g: 1500, fade: 1.8,
    da: 1, ds: 10, dci: 0, ci: 0, ch: '', fly: false, ox: 0, oy: 0, arc: 0,
    inst: false, fixed: false, layer: -1 };
  Object.assign(p, props);
  p.ci = pick(p.fam); if (!p.ch) p.ch = pick(p.gs);
  if (p.fly) p.arc = rand(20, 160);
  particles.push(p); el.parts.push(p);
  return p;
}

function buildVase(def, start) {
  const el = { type: 'vase', def, parts: [] }; elements.push(el);
  const rf = profileFn(def.pts); let row = 0;
  for (let h = 0; h <= def.H + 0.01; h += SPV * 0.9, row++) {
    const r = rf(h), na = Math.max(6, Math.round(TAU * r / SPV));
    for (let k = 0; k < na; k++) {
      const a = (k + (row & 1) * 0.5) / na * TAU;
      if (def.topAt && h > def.topAt(a)) continue;
      const [fn, gn] = def.color(h, a, def.H, r);
      const p = P(el, { lx: r * Math.cos(a), ly: h, lz: r * Math.sin(a), nx: Math.cos(a), nz: Math.sin(a), hasN: true,
        fam: FAMS[fn], gs: G[gn], gm: SPV / SP });
      p.delay = start + (h / def.H) * (def.mound ? 0.6 : 1.3) + rand(0.25);
    }
  }
  return el;
}

function makeFlowerEl(kind, scheme, kbase) {
  const a = rand(TAU), r = Math.sqrt(Math.random());
  const f = { type: 'flower', kind, scheme, kbase, base: kbase, size: kbase, tsize: kbase, gsp: SP,
    p: v3(), tp: v3(), n0: v3(0, 1, 0), tn: v3(0, 1, 0), spin: rand(TAU), spinRate: rand(0.15, 0.45) * (Math.random() < .5 ? -1 : 1),
    ph: rand(TAU), bo: { x: r * Math.cos(a), y: r * Math.sin(a) }, tb: v3(), stem: null, parts: [], still: false,
    nx: 0, ny: 1, nz: 0, ux: 1, uy: 0, uz: 0, vx: 0, vy: 0, vz: 1, cs: 1, sn: 0 };
  elements.push(f);
  return f;
}
function makeFlower(i) {
  const [kind, scheme] = chooseFlower(i);
  return makeFlowerEl(kind, scheme, BASE_SIZE[kind] * rand(0.85, 1.15));
}

function resizeStem(e, len, b, extra, spc) {
  const step = spc || SPS;
  const n = Math.max(4, Math.ceil(len / step)), old = e.parts.length;
  for (let j = old; j < n; j++) {
    const p = P(e, Object.assign({ gs: G.stem, fam: FAMS[Math.random() < 0.2 ? 'greenDark' : 'green'],
      lx: (Math.random() - .5) * 2, lz: (Math.random() - .5) * 2, gm: step / SPS }, extra));
    p.delay = b + (j / n) * 0.6 + rand(0.12);
  }
  const m = e.parts.length;
  e.parts.forEach((p, j) => { p.tt = j / (m - 1); if (j >= old) p.t = p.tt; });
}

function buildLeaf(stem, b, extra, L, t0, spc) {
  const e = { type: 'leaf', stem, t0, az: rand(TAU), S: v3(), D: v3(), Sd: v3(), parts: [] };
  elements.push(e);
  const step = spc || SP * 0.9;
  for (let u = 2; u <= L; u += step) {
    const w = Math.sin(Math.PI * u / L) * L * 0.22;
    for (const v of lanes(w, step)) {
      const p = P(e, Object.assign({ lx: u, ly: v, gs: G.leaf, fam: FAMS[Math.abs(v) < step * 0.45 ? 'greenDark' : 'leaf'], gm: step / SP }, extra));
      p.delay = b + u / L * 0.4 + rand(0.12);
    }
  }
}

function stemLen(f) { return Math.hypot(f.tp.x - f.tb.x, f.tp.y - f.tb.y, f.tp.z - f.tb.z) * 1.15; }

function buildFlowerParts(f, b, sp, extra, garden, noLeaves) {
  f.base = f.size; f.gsp = sp * f.base;
  const pts = GEN[f.kind](sp, SCHEME[f.scheme]);
  for (const q of pts) {
    const p = P(f, Object.assign({ lx: q.x, ly: q.y, lz: q.z, fam: FAMS[q.fam], gs: G[q.gs] }, extra));
    p.delay = b + 0.6 + q.rn * 0.5 + rand(0.15);
  }
  const st = { type: 'stem', f, b: copy3(f.tb), tb: f.tb, parts: [], B: v3(), C1: v3(), C2: v3(), E: v3() };
  f.stem = st; elements.push(st);
  resizeStem(st, stemLen(f), b, extra, garden ? SPS * 1.5 : SPS);
  if (noLeaves) return;
  if (garden) {
    const h = f.tp.y - f.tb.y, nl = f.size < 24 ? 1 : 2;
    for (let i = 0; i < nl; i++) buildLeaf(st, b + 0.3 + i * 0.2, extra, rand(14, 22) + h * 0.08, rand(0.15, 0.55), SP * 1.6);
  } else {
    const nl = Math.random() < 0.6 ? 1 : 2;
    for (let i = 0; i < nl; i++) buildLeaf(st, b + 0.3 + i * 0.15, extra, rand(22, 34), rand(0.5, 0.8));
  }
}

function makeFiller(b) {
  const th = rand(0, 1.3), ph = rand(TAU);
  const e = { type: 'filler', d: v3(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)), rOff: rand(6, 26),
    p: v3(), tp: v3(), parts: [] };
  elements.push(e); fillers.push(e);
  const n = 6 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) {
    const p = P(e, { lx: gauss() * 5, ly: gauss() * 5, lz: gauss() * 5, gs: G.filler, fam: FAMS[Math.random() < 0.75 ? 'white' : 'blush'], gm: 0.8 });
    p.delay = b + rand(0.3);
  }
  return e;
}

function layout(s) {
  const def = VASES[s], N = flowers.length;
  const Rd = N === 1 ? 0 : 22 + 30 * Math.sqrt(N);
  const cy = def.mouthH + (def.mound ? 150 : def.wrap ? 40 : 50) + Rd * 0.3;
  const thMax = N <= 3 ? 0.75 : 1.2;
  const mult = N === 1 ? 1.6 : N <= 3 ? 1.3 : N <= 5 ? 1.2 : N <= 8 ? 1.12 : N <= 15 ? 1.05 : 1;
  flowers.forEach((f, i) => {
    let dx = 0, dy = 1, dz = 0;
    if (N > 1) {
      const c = 1 - (i + 0.5) / N * (1 - Math.cos(thMax)), th = Math.acos(c), ph = i * GA + 0.6;
      dx = Math.sin(th) * Math.cos(ph); dy = c; dz = Math.sin(th) * Math.sin(ph);
    }
    f.tp.x = dx * Rd; f.tp.y = cy + dy * Rd * 0.7; f.tp.z = dz * Rd;
    const n = N === 1 ? v3(0, 0.5, 0.87) : v3(dx * 1.4, dy * 0.7 + 0.25, dz * 1.4);
    Object.assign(f.tn, norm(n));
    f.tsize = f.kbase * mult;
    if (def.mound) { f.tb.x = 0; f.tb.y = 8; f.tb.z = 0; }
    else if (def.wrap) { f.tb.x = f.bo.x * 7; f.tb.y = -58; f.tb.z = f.bo.y * 7; }
    else { f.tb.x = f.bo.x * def.mouthR * 0.45; f.tb.y = def.mouthH * 0.42; f.tb.z = f.bo.y * def.mouthR * 0.45; }
  });
  fillers.forEach(fl => {
    const R = Math.max(Rd, 34) + fl.rOff;
    fl.tp.x = fl.d.x * R; fl.tp.y = cy + fl.d.y * R * 0.7; fl.tp.z = fl.d.z * R;
  });
  cam.tTop = cy + Rd * 0.75 + 62;
  cam.tBot = def.wrap ? -72 : -10;
  cam.tHalf = Math.max(def.maxR, Rd + 55);
}

function drainEl(el, t0, spread) {
  el.dying = true;
  for (const p of el.parts) {
    if (p.state === 0) { p.dead = true; continue; }
    p.state = 3; p.dStart = t0 + rand(spread);
    p.vx = gauss() * 50; p.vy = rand(-70, 20); p.g = 1500; p.fade = 1.5;
  }
}

function startStage(s) {
  stage = s; mode = 'grow';
  const t0 = T, def = VASES[s];
  let vStart = 0;
  if (vaseEl) { drainEl(vaseEl, t0, 0.7); vStart = 0.5; }
  vaseEl = buildVase(def, t0 + vStart);

  const newF = [];
  while (flowers.length < COUNTS[s]) { const f = makeFlower(flowers.length); flowers.push(f); newF.push(f); }
  const cursor = t0 + vStart + (def.mound ? 0.8 : 1.3);
  const step = Math.min(0.3, 2.2 / Math.max(1, newF.length));
  const fillStart = cursor + newF.length * step + 0.4;
  const newFill = [];
  while (fillers.length < FILL[s]) newFill.push(makeFiller(fillStart + rand(1.0)));

  layout(s);
  for (const f of newF) { Object.assign(f.p, f.tp); Object.assign(f.n0, f.tn); f.size = f.tsize; }
  for (const fl of newFill) Object.assign(fl.p, fl.tp);

  for (const f of flowers) if (f.stem) resizeStem(f.stem, stemLen(f), t0 + rand(0.4, 1.4));
  newF.forEach((f, i) => buildFlowerParts(f, cursor + i * step, SP / f.size));

  stageEnd = fillStart + 1.6 + (s === 0 ? 2.5 : s === VASES.length - 1 ? 3 : 1.4);
}

const LAV = { x0: 330, x1: 640, z0: 90, z1: 330 };             // lavender rows
function baseH(x, z) {

    const dx = p.px - ex, dy = p.py - ey, l = Math.hypot(dx, dy) || 1, sp = rand(80, 380);
    p.state = 3; p.dStart = T + rand(0.4);

  gcam.from = {}; for (const k of CAMKEYS) gcam.from[k] = cam[k];
  Object.assign(gcam, { yaw: cam.yaw, pitch: 0.58, roll: 0, tx: 0, ty: 50, tz: 60, D: 2400, half: 1000, rate: 1.2,

function buildGarden(t0, ex, ey) {

  // ---- flowers ----
  const specs = [];
  for (const [k, g] of Object.entries(GSPEC))
    for (let i = 0; i < g.n; i++) specs.push({ k, size: rand(...g.size), h: rand(...g.h), scheme: pick(KIND_SCHEMES[k]) });

    f.tb.x = x; f.tb.y = baseY; f.tb.z = z;

    else { const ta = rand(TAU), tl = rand(0, 0.35); n = v3(Math.sin(tl) * Math.cos(ta), Math.cos(tl), Math.sin(tl) * Math.sin(ta)); }

/* ---------- zoom into a single flower ---------- */
function zoomTo(f) {
  zf = f; f.still = true;
  $ghint.classList.remove('show');
  gcam.transEnd = 0;
  gcam.tx = f.p.x; gcam.ty = f.p.y + f.size * 0.15; gcam.tz = f.p.z;
  gcam.pitch = 1.05; gcam.D = 420; gcam.half = f.size * 2; gcam.rate = 1.6;
  gcam.yaw = cam.yaw;

  const nb = clamp(Math.round(f.size / 14), 1, 5);
  const acts = shuffle(ACTS.slice()).slice(0, nb);
  acts.forEach((a, i) => makeBee(f, a[0], i));

  const name = (SCHEME_NAME[f.scheme] ? SCHEME_NAME[f.scheme] + ' ' : '') + KIND_NAME[f.kind];
  $info.innerHTML = `<b>${name.toUpperCase()}</b><br>` +
    acts.map(a => `<span class="bee">&#128029; ${a[1]}</span>`).join('<br>') +
    `<br><span class="dim">click anywhere or press Esc to return to the garden</span>`;
  $info.classList.add('show');
}

function zoomOut() {
  if (!zf) return;
  zf.still = false; zf = null;
  for (const e of zoomEls) { e.dying = true; for (const p of e.parts) p.dead = true; }
  zoomEls = [];
  Object.assign(gcam, { pitch: 0.58, tx: 0, ty: 50, tz: 60, D: 2400, half: 1000, rate: 1.1 });
  $info.classList.remove('show');
}

    particles = particles.filter(p => !p.dead);
    for (const e of elements) if (e.dying) e.parts = e.parts.filter(p => !p.dead);
    elements = elements.filter(e => !(e.dying && e.parts.length === 0));
  }
  if (frameNo % 6 === 0) {
    let pointer = mode === 'await';
    if (mode === 'garden' && !zf && T > gardenReadyAt && mouse.x >= 0) pointer = !!pickFlower(mouse.x, mouse.y);
    if (zf) pointer = true;
    cv.style.cursor = pointer ? 'pointer' : 'default';
  }
  requestAnimationFrame(frame);
}

function onClick(e) {
  if (mode === 'await') explode();
  else if (mode === 'garden') {
    if (zf) zoomOut();
    else if (T > gardenReadyAt) { const f = pickFlower(e.clientX, e.clientY); if (f) zoomTo(f); }
  }
}
function skip() {
  if (mode === 'grow') { if (stage < VASES.length - 1) startStage(stage + 1); else enterAwait(); }
  else if (mode === 'await') explode();
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') skip();
  else if (e.key === 'Escape') zoomOut();
});
cv.addEventListener('click', onClick);
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('resize', resize);
setTimeout(() => $hint.style.opacity = 0, 7000);

resize();
startStage(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
